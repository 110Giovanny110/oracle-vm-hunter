name: Caçar VM Oracle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cacar-vm
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  tentar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar credenciais
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/chave.pem
          chmod 600 ~/.oci/chave.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/chave.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Tentar criar a VM
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: bash criar-vm.sh

      # Conseguiu (ou já existe): desliga este workflow para parar de tentar.
      - name: Parar as tentativas
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Caçar VM Oracle" --repo "${{ github.repository }}"
